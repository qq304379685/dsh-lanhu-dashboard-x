# dsh-lanhu-proto 装配补丁
# cookieFile 留空则使用 profile 数据目录下的 cookie.txt（可在面板里粘贴更新）
- insert:
    - id: lanhu-proto
      name: 'dsh-lanhu-proto'
      config:
        baseUrl: 'https://lanhuapp.com'
        cookieFile: ''
        # 留空 = 用账号下的第一个团队空间 / 项目；面板里选过一次会记住
        defaultTeamId: ''
        defaultProjectId: ''
